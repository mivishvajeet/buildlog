services:
  db:
    image: postgres:16-alpine
    container_name: buildlog-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: buildlog
      POSTGRES_USER: buildlog
      POSTGRES_PASSWORD: buildlog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildlog -d buildlog"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: buildlog-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://buildlog:buildlog@db:5432/buildlog
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
