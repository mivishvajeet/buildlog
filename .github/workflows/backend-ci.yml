name: Backend CI

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend and development dependencies
        run: pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check backend

      - name: Run tests
        run: pytest
